<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strudel Experiments</title>
<link rel="icon" href="assets/images/favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#050914;--panel:#07101e;--text:#d7f7ff;--muted:#62819a;--cyan:#18dfff;--magenta:#ff19c8;--line:#15304a}
html[data-theme=light]{--bg:#eef5fb;--panel:#fff;--text:#102746;--muted:#607997;--cyan:#008fd0;--magenta:#e000aa;--line:#c4d8e9}
html{background:var(--bg);color-scheme:dark}html[data-theme=light]{color-scheme:light}
body{min-height:100vh;background:radial-gradient(circle at 70% -15%,rgba(24,223,255,.10),transparent 34%),var(--bg);color:var(--text);font-family:"JetBrains Mono",monospace}
.scanlines{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.28;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:100% 4px}
.pixel{font-family:"Press Start 2P",monospace}
.header-line{height:2px;background:linear-gradient(90deg,var(--cyan) 0 72%,transparent 72% 76%,var(--magenta) 76% 82%,transparent 82%)}
.card{position:relative;background:linear-gradient(135deg,var(--panel),color-mix(in srgb,var(--panel) 75%,var(--cyan)));border:1px solid var(--accent);transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 18%,transparent)}
.card:before{content:"";position:absolute;left:-1px;top:-1px;width:38px;height:38px;background:linear-gradient(135deg,var(--accent) 0 48%,transparent 49%)}
.card:after{content:"";position:absolute;right:-1px;bottom:-1px;width:15px;height:15px;background:linear-gradient(315deg,var(--accent) 0 45%,transparent 46%)}
.pixel-btn{border:1px solid currentColor;clip-path:polygon(0 6px,6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px));transition:.15s}
.pixel-btn:hover{filter:brightness(1.25);box-shadow:0 0 14px currentColor}
.search{border:1px solid var(--cyan);background:var(--panel);clip-path:polygon(0 7px,7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px))}
.theme{border:1px solid var(--cyan);background:var(--panel)}
.theme button{width:34px;height:28px}.theme .active{background:var(--magenta);color:white;box-shadow:0 0 12px rgba(255,25,200,.35)}
</style>
<script>
(()=>{const t=localStorage.getItem("strudel-theme");if(t)document.documentElement.dataset.theme=t})()
</script>
</head>
<body>
<div class="scanlines"></div>
<main class="relative z-10 max-w-5xl mx-auto px-5 sm:px-7 py-8 sm:py-12">
<header class="mb-9">
<div class="flex items-center gap-4 sm:gap-5">
<img src="assets/images/logo.webp" alt="Strudel Experiments" class="w-12 h-12 sm:w-14 sm:h-14 shrink-0">
<div class="flex-1 min-w-0">
<div class="flex items-start justify-between gap-4">
<div>
<h1 class="pixel text-[15px] sm:text-xl md:text-2xl">STRUDEL EXPERIMENTS</h1>
<p class="mt-3 text-xs sm:text-sm text-[var(--cyan)]">// experimental music / live coding</p>
</div>
<div class="theme shrink-0 rounded-md p-0.5 flex">
<button id="light" title="Light theme">☼</button><button id="dark" title="Dark theme">◐</button>
</div>
</div></div></div>
<div class="header-line mt-5"></div>
</header>

<section class="mb-7">
<div class="search flex items-center gap-3 px-4 py-3">
<span class="text-[var(--cyan)]">&gt;_</span>
<input id="search" type="search" placeholder="search experiments..." autocomplete="off" class="bg-transparent outline-none w-full text-sm">
</div>
</section>

<div id="status" class="mb-5 text-[10px] sm:text-xs text-[var(--muted)]">● loading catalogue...</div>
<section id="songs" class="grid gap-4"></section>

<footer class="mt-12 pt-5 border-t border-[var(--line)] flex flex-col sm:flex-row justify-between gap-3 text-[10px] sm:text-xs text-[var(--muted)]">
<span>GITHUB://NEGOTRUCKY/STRUDELEXPERIMENT</span>
<a href="https://strudel.cc/" target="_blank" rel="noopener" class="hover:text-[var(--cyan)]">STRUDEL.CC ↗</a>
</footer>
</main>

<script>
const box=document.getElementById("songs"),status=document.getElementById("status"),search=document.getElementById("search");
let songs={}; const accents=["#ff19c8","#18dfff","#24e58a","#ffd42a"];
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const shortUrl=k=>{const u=new URL(location.href);u.search="";u.hash="";u.searchParams.set("play",k);return u.toString()};

function render(filter=""){
 const q=filter.trim().toLowerCase();
 const list=Object.entries(songs).filter(([k,s])=>
   k.toLowerCase().includes(q)||String(s.title||"").toLowerCase().includes(q)||String(s.artist||"").toLowerCase().includes(q)
 ).sort((a,b)=>String(a[1].title||a[0]).localeCompare(String(b[1].title||b[0])));
 if(!list.length){box.innerHTML='<div class="text-center py-16 text-[var(--muted)] text-xs">NO EXPERIMENTS FOUND...</div>';return}
 box.innerHTML=list.map(([k,s],i)=>{const a=accents[i%accents.length];return `
 <article class="card rounded-md p-5 sm:p-6" style="--accent:${a}">
  <div class="flex flex-col sm:flex-row sm:items-center gap-5">
   <div class="flex-1 min-w-0 pl-3">
    <div class="flex items-center gap-3"><span style="color:${a}">◆</span><h2 class="pixel text-sm sm:text-base md:text-lg" style="color:${a}">${esc(s.title||k)}</h2></div>
    <div class="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-[10px] sm:text-xs text-[var(--muted)]">
      <span>${esc(s.filename)}</span>${s.artist?`<span>@ ${esc(s.artist)}</span>`:""}${s.bpm?`<span>${esc(s.bpm)} BPM</span>`:""}
    </div>
   </div>
   <div class="flex gap-2 sm:flex-col md:flex-row">
    <a href="${esc(s.strudel_link)}" class="pixel-btn inline-flex justify-center px-5 py-2.5 text-[10px] sm:text-xs font-bold" style="color:${a}">▶ PLAY</a>
    <button data-key="${esc(k)}" class="pixel-btn px-4 py-2.5 text-[10px] sm:text-xs text-[var(--cyan)]">↗ SHARE</button>
   </div>
  </div>
 </article>`}).join("");
 box.querySelectorAll("[data-key]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(shortUrl(b.dataset.key));let o=b.textContent;b.textContent="✓ COPIED";setTimeout(()=>b.textContent=o,1200)}catch{prompt("Copy this link:",shortUrl(b.dataset.key))}});
}
async function load(){
 try{const r=await fetch("songs.json",{cache:"no-store"});if(!r.ok)throw Error(r.status);songs=await r.json();const n=Object.keys(songs).length;status.innerHTML=`<span class="text-[var(--cyan)]">●</span> ${n} EXPERIMENT${n===1?"":"S"}`;render()}
 catch(e){console.error(e);status.innerHTML='<span class="text-red-500">●</span> UNABLE TO LOAD SONGS.JSON'}
}
async function route(){
 const k=new URLSearchParams(location.search).get("play");if(!k)return false;
 try{const r=await fetch("songs.json",{cache:"no-store"});if(!r.ok)throw Error();const c=await r.json();if(!c[k]?.strudel_link)throw Error();location.replace(c[k].strudel_link);return true}
 catch{document.body.innerHTML='<main class="min-h-screen grid place-items-center"><div class="text-center font-mono"><div class="text-red-500 text-xl mb-4">ERROR 404</div><p class="text-[var(--muted)]">EXPERIMENT NOT FOUND</p><a href="'+location.pathname+'" class="inline-block mt-6 text-[var(--cyan)]">← BACK</a></div></main>';return true}
}
function theme(t){document.documentElement.dataset.theme=t;localStorage.setItem("strudel-theme",t);updateSwitch()}
function updateSwitch(){document.getElementById("light").classList.toggle("active",document.documentElement.dataset.theme==="light");document.getElementById("dark").classList.toggle("active",document.documentElement.dataset.theme!=="light")}
document.getElementById("light").onclick=()=>theme("light");document.getElementById("dark").onclick=()=>theme("dark");search.oninput=()=>render(search.value);updateSwitch();
(async()=>{if(!(await route()))await load()})();
</script>
</body>
</html>
